  <text x="220" y="1000" font-family="monospace" font-weight="700" font-size="76" fill="#fafafa">agent-deck</text>
  <text x="220" y="1050" font-family="monospace" font-size="30" fill="#71717a">self-hosted kanban for coding agents · Rust</text>
</svg>
